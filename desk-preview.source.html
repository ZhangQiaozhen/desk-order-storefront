<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌序 Desk Order · 桌面用品商店</title><style>
HERO_CSS
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:#222622;font:16px/1.6 Inter,"Microsoft YaHei",sans-serif;background:#fafaf8}button,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit}.frame{max-width:1500px;padding:0 4vw;margin:auto}header{height:82px;display:flex;align-items:center;gap:32px}header a{text-decoration:none}.brand{font-size:23px;letter-spacing:-.055em;font-weight:800}.brand span{font-size:15px;letter-spacing:-.025em;margin-left:8px}nav{margin-left:auto;display:flex;gap:26px;align-items:center;font-size:15px}nav button,.light{background:none;border:1px solid #c9cdc6;border-radius:30px;padding:8px 16px}.sectionhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:46px 0 18px}.sectionhead h2{margin:0;font-size:clamp(26px,3vw,40px);letter-spacing:-.05em}.small,footer{color:#59615c;font-size:14px}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{display:block;width:100%;text-align:left;border:0;padding:0;background:none}.card img,.detail-image{display:block;width:100%;aspect-ratio:1.28;object-fit:cover;border-radius:14px;background:#e9eae8}.card img{transition:filter .2s}.card:hover img{filter:brightness(1.035)}.card strong{display:block;font-size:20px;margin:14px 0 2px}.price{font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.service{margin:50px 0 0;padding:28px 0;border-top:1px solid #d5d8d1}details{padding:13px 0;border-bottom:1px solid #ddd}summary{cursor:pointer}footer{padding:25px 0 40px}dialog{max-height:90dvh;width:min(500px,94vw);border:0;border-radius:20px;padding:24px;color:inherit;box-shadow:0 24px 90px #0003}dialog::backdrop{background:#13191380}dialog h2{margin:0;font-size:25px}dialog h3{margin-bottom:4px}.detail-image{margin-top:16px}.dark{border:0;border-radius:28px;background:#26332c;color:white;padding:12px 20px}.wide{width:100%;margin-top:18px}select{padding:8px;border-radius:8px;background:white}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1875bd;outline-offset:3px}.line{border-bottom:1px solid #ddd;padding:14px 0}.line button{background:#fff;border:1px solid #ccc;border-radius:6px;min-width:34px}.line p{margin:4px 0}.cart-total{font-size:20px;font-weight:bold}.guide{background:#eceee9;padding:12px;border-radius:10px;margin:10px 0}.desk-map{height:70px;display:grid;align-items:center;position:relative}.pad{height:65%;background:#636e68;border-radius:6px;margin:auto}.keys{position:absolute;left:33%;width:30%;height:18px;background:repeating-linear-gradient(90deg,#f6f4ed 0 5px,#c5c8bc 5px 6px);border-radius:3px}.dot{position:absolute;left:65%;width:6%;height:19px;border-radius:45%;background:#f7f6ef}@media(max-width:650px){header{height:66px;gap:10px}nav{gap:10px}nav>a{display:none}.catalog{grid-template-columns:repeat(2,1fr);gap:20px 12px}.card strong{font-size:17px}.card .row{display:block}.sectionhead{margin-top:30px}.sectionhead .small{font-size:12px}.frame{padding:0 16px}.desk-hero{min-height:395px}.service{margin-top:30px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body><div class="frame"><header><a class="brand" href="#top">桌序<span>Desk Order</span></a><nav><a href="#products">全部商品</a><a href="#service">购买说明</a><button id="bag">购物袋 (<span id="count">0</span>)</button></nav></header><main id="top">
HERO_HTML
<section id="products"><div class="sectionhead"><h2>桌面选物</h2><span class="small">概念系列 · 展示价</span></div><div class="catalog" id="cards"></div></section>
<section id="service" class="service"><h2>购买说明</h2><details><summary>如何选择桌垫尺寸？</summary><p>先量出桌面可用的宽度与深度，再打开桌垫详情切换尺寸，对照键盘所占的位置。</p></details><details><summary>目前可以下单吗？</summary><p>目前为品牌商品展示，图片为概念图，价格为示例。你可以选规格、加入购物袋并查看小计。正式发售后会公布配送范围、到货时间和退换条件。</p></details></section></main><footer>桌序 Desk Order</footer></div>
<dialog id="panel" aria-labelledby="panelTitle"><div class="row"><h2 id="panelTitle"></h2><button class="light" onclick="panel.close()">关闭</button></div><div id="body"></div></dialog>
<script>
const products=[
 {name:'原野毛毡桌垫',color:'石墨灰',desc:'给键盘与鼠标划出一块连续的操作区。小尺寸适合紧凑桌面，大尺寸为鼠标和笔记本多留一些空间。',options:['60 × 30 cm','80 × 40 cm'],prices:[129,169],image:'ITEM_0'},
 {name:'方隅木纹收纳盘',color:'胡桃棕',desc:'把钥匙、耳机与零散小物放在手边。浅口与圆角轮廓，让每天要拿走的东西一眼可见。',options:['长方形'],prices:[99],image:'ITEM_1'},
 {name:'线序理线座',color:'炭黑',desc:'让常用充电线的位置固定在桌边。四道线槽分开放置线头，伸手就能找到。',options:['四槽'],prices:[39],image:'ITEM_2'}
];
const panel=document.querySelector('#panel'),content=document.querySelector('#body');
let cart={};try{const saved=JSON.parse(localStorage.getItem('desk-bag-v1'));for(const [key,n] of Object.entries(saved||{})){if(/^\d+:\d+$/.test(key)&&Number.isInteger(n)&&n>0&&n<=99){const [i,j]=key.split(':');if(products[i]?.prices[j])cart[key]=n}}}catch{}
function save(){document.querySelector('#count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);try{localStorage.setItem('desk-bag-v1',JSON.stringify(cart))}catch{}}
function show(title){document.querySelector('#panelTitle').textContent=title;if(!panel.open)panel.showModal();panel.scrollTop=0}
function detail(i){const p=products[i];show(p.name);content.innerHTML='<img class="detail-image" alt="'+p.name+'概念图" src="'+p.image+'"><p>'+p.desc+'</p><p class="small">'+p.color+' · 商品概念图</p><label>规格 <select>'+p.options.map(o=>'<option>'+o+'</option>').join('')+'</select></label>'+(i===0?'<div class="guide"><div class="desk-map"><div class="pad"></div><div class="keys"></div><div class="dot"></div></div><small>尺寸对照 · 键盘宽 30 cm</small></div>':'')+'<p class="price"></p><button class="dark wide">加入购物袋</button>';const select=content.querySelector('select');function update(){const j=select.selectedIndex;content.querySelector('.price').textContent='展示价 ¥'+p.prices[j];if(i===0)content.querySelector('.pad').style.width=j?'80%':'60%'}select.onchange=update;update();content.querySelector('.dark').onclick=()=>{const k=i+':'+select.selectedIndex;cart[k]=Math.min(99,(cart[k]||0)+1);save();bag()}}
function bag(){show('购物袋');content.innerHTML='';let total=0;for(const [key,n] of Object.entries(cart)){const [i,j]=key.split(':');const p=products[i];total+=p.prices[j]*n;const el=document.createElement('div');el.className='line';el.innerHTML='<strong>'+p.name+'</strong><p>'+p.options[j]+' · ¥'+p.prices[j]+'</p><div class="row"><span><button aria-label="减少数量">−</button> '+n+' <button aria-label="增加数量">+</button></span><button>移除</button></div>';el.querySelectorAll('button').forEach((b,k)=>{b.disabled=k===1&&n>=99;b.onclick=()=>{const next=k===0?n-1:k===1?n+1:0;if(next)cart[key]=next;else delete cart[key];save();bag()}});content.append(el)}content.insertAdjacentHTML('beforeend',total?'<p class="cart-total">商品小计　¥'+total+'</p><p class="small">当前为商品展示，暂未开放付款。</p>':'<p>购物袋还是空的。</p>');const back=document.createElement('button');back.className='dark wide';back.textContent='继续选购';back.onclick=()=>{panel.close();location.hash='products'};content.append(back)}
products.forEach((p,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<img alt="'+p.name+'概念图" src="'+p.image+'"><strong>'+p.name+'</strong><span class="row"><span class="small">'+p.color+'</span><span>¥'+p.prices[0]+(p.options.length>1?' 起':'')+'</span></span>';b.onclick=()=>detail(i);document.querySelector('#cards').append(b)});document.querySelector('#bag').onclick=bag;save()
</script></body></html>
